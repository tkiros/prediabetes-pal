# CI — the gates that were claimed but never ran.
#
# `docs/qa/05-known-risks-and-blockers.md` marked QA-01 ("no lint config; no CI
# workflow") as **Fixed**. It was not. This file existed only as an UNTRACKED
# local file — `git ls-tree origin/main` showed no `.github/` at all — so GitHub
# had never executed it, and the original finding's condition ("test gates run
# only by hand") was still literally true on every branch, including main.
#
# Everything below except typecheck/test/bakeoff is a gate that did not
# previously exist anywhere:
#   lint      — there was no eslint config and eslint was not even a dependency
#               (QA-01's second half, never addressed at all)
#   build     — never gated; a build break could reach main
#   contract  — scripts/validate-safety-contract.mjs existed but was wired to
#               NOTHING: no npm script, no CI step. It validates the copy ledger
#               and runs the forbidden-claim regexes over every approved string.
#   secrets   — no secret scan, in a repo whose own QA record carries two
#               unrotated key exposures (SEC-01/SEC-02)
#   e2e       — 15 Playwright specs (incl. axe a11y) were unreachable from any
#               npm script: vitest.config.ts only matches *.test.ts and there was
#               no `e2e` script. They could only ever be run by hand.
name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast gates first — fail in ~2 minutes rather than after a 10-minute E2E run.
  static:
    name: typecheck · lint · contract · build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run contract
      # AUD-005: production-mode config gate. Loads the real next.config.ts
      # with synthetic non-secret values and asserts the flag twin guards fire
      # for every client/server pair (client-on/server-off must fail) and stay
      # quiet for agreeing pairs — so a mis-paired production env can never be
      # discovered for the first time on a Vercel deploy.
      - run: npm run config:production-check
      # RE-08: schema drift gate. `check` validates the migration journal is
      # internally consistent; the no-op `generate` proves schema.ts matches
      # the committed migrations (any diff creates files → fail). Without
      # this, a hand-applied prod change or an uncommitted migration hides
      # until it breaks a deploy.
      - name: drizzle schema drift
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name ci-drift-probe
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::schema.ts does not match the committed migrations"
            git status --porcelain drizzle/
            exit 1
          fi
      - run: npm run build
        env:
          # lib/server/crypto fails CLOSED without a key rather than handling
          # health data unencrypted, so the build needs one. A throwaway CI value
          # exercises that path and never touches real data.
          HEALTH_DATA_KEY: ${{ secrets.CI_HEALTH_DATA_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}

  test:
    name: unit · evals (mock — no keys, no spend)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run eval:model-bakeoff:mock

  e2e:
    name: playwright (incl. axe a11y)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Both `next start` servers in playwright.config.ts inherit DATABASE_URL
    # from the environment, and auth.ts:21 only constructs the Auth.js adapter
    # when it is set. Without a database every auth path dies on MissingAdapter.
    services:
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revora_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/revora_e2e
      HEALTH_DATA_KEY: ${{ secrets.CI_HEALTH_DATA_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit migrate
      # playwright.config.ts runs FOUR projects: Mobile Chrome (Pixel 5) and
      # Desktop Chrome on chromium, Mobile Safari (iPhone 12) on webkit, and
      # Desktop Firefox on gecko. Every engine a project names must be installed
      # here or that project fails at browser launch, taking the whole job with
      # it — installing chromium alone once failed all 110 Mobile Safari tests,
      # and omitting firefox failed this job the moment the Gecko project landed.
      # ⚠️ Adding a project to playwright.config.ts means editing this line too.
      - run: npx playwright install --with-deps chromium webkit firefox
      # The runner builds isolated legacy + trial optimized local outputs
      # before Playwright starts, including its syntactically valid smoke-only
      # VAPID key. It explicitly blanks every provider credential before Next
      # can load env files. With the isolated CI database present it also
      # provisions and removes an owner-only disk mailbox, so auth/account E2E
      # cannot skip or contact Resend. No provider mutation leaves this job.
      - run: npm run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # On a pull_request, gitleaks-action scans the PR's own commits, which it
    # enumerates via GET /repos/{o}/{r}/pulls/{n}/commits. The default
    # GITHUB_TOKEN could not read that endpoint (403 "Resource not accessible
    # by integration") and the job died before scanning anything.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks needs history: SEC-02 is a set of live keys in commit 213ab8a.
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # gitleaks-action asks the PR commits API for one unpaginated page. On a
      # PR with more than 30 commits its default range silently stops early.
      # The action installs the pinned binary; this second scan derives the
      # complete first-parent range from Git itself and therefore covers every
      # non-merge commit in the PR. Pull-request workflows check out GitHub's
      # synthetic merge commit by default, so the range must end at the real PR
      # head SHA rather than HEAD.
      - name: scan complete pull-request commit range
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Without pipefail/errexit a failed merge-base leaves scan_base empty
          # and the range degrades to "..HEAD" — gitleaks then scans nothing
          # and exits 0. Strict mode turns that edge into a red job instead.
          set -euo pipefail
          git cat-file -e "${PR_HEAD_SHA}^{commit}"
          scan_base="$(git merge-base "origin/${PR_BASE_REF}" "${PR_HEAD_SHA}")"
          scan_count="$(git rev-list --count --no-merges --first-parent "${scan_base}..${PR_HEAD_SHA}")"
          if [ "${scan_count}" -lt 1 ]; then
            echo "::error::complete PR scan resolved to zero commits"
            exit 1
          fi
          echo "Scanning ${scan_count} non-merge commits from merge base to PR head"
          gitleaks detect \
            --redact \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results-full-range.sarif \
            --log-opts="--no-merges --first-parent ${scan_base}..${PR_HEAD_SHA}"
