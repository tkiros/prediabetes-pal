<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Prediabetes Pal — offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f3f7fb;
        color: #1e293b;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 26rem;
        width: 100%;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 16px;
        padding: 28px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        color: #0f172a;
      }
      p {
        margin: 0 0 12px;
        color: #475569;
      }
      .disclaimer {
        margin: 16px 0 0;
        font-size: 0.8125rem;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Prediabetes Pal needs a connection to check a meal. Reconnect and try again. Nothing you type is stored.</p>
      <p class="disclaimer">
        Prediabetes Pal is informational only and is not medical advice. Talk with a doctor or
        registered dietitian for guidance that is specific to you.
      </p>
    </main>
  </body>
</html>
